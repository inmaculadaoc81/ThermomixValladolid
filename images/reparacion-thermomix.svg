<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Robot de cocina Thermomix sobre la mesa de trabajo del servicio técnico ThermomixRepair, junto a herramientas de reparación">
  <defs>
    <linearGradient id="trBodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F5B42"/>
      <stop offset="1" stop-color="#0A1F17"/>
    </linearGradient>
    <linearGradient id="trGreenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FDBB6"/>
      <stop offset="1" stop-color="#166B48"/>
    </linearGradient>
    <linearGradient id="trBenchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEAE1"/>
      <stop offset="1" stop-color="#DCD7C9"/>
    </linearGradient>
    <filter id="trSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0A1F17" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="800" fill="#F2F7F3"/>
  <circle cx="920" cy="190" r="260" fill="#E3F3EA"/>
  <circle cx="960" cy="150" r="150" fill="#D7ECDF"/>

  <!-- steam blobs -->
  <g opacity=".55">
    <circle cx="640" cy="150" r="34" fill="#C7E7D5"/>
    <circle cx="600" cy="110" r="22" fill="#C7E7D5"/>
    <circle cx="676" cy="100" r="18" fill="#C7E7D5"/>
  </g>

  <!-- workbench -->
  <rect x="60" y="560" width="1080" height="26" rx="6" fill="url(#trBenchGrad)"/>
  <rect x="60" y="586" width="1080" height="150" fill="#CFC9B8"/>
  <rect x="60" y="586" width="1080" height="10" fill="#C1BAA6"/>

  <!-- wrench + screwdriver on bench -->
  <g transform="translate(150,600)" filter="url(#trSoft)">
    <rect x="0" y="18" width="150" height="14" rx="7" fill="#5B6670" transform="rotate(-8 0 18)"/>
    <circle cx="4" cy="10" r="18" fill="none" stroke="#5B6670" stroke-width="10"/>
    <circle cx="146" cy="34" r="16" fill="none" stroke="#5B6670" stroke-width="9"/>
  </g>
  <g transform="translate(330,610)" filter="url(#trSoft)">
    <rect x="0" y="8" width="16" height="70" rx="8" fill="#C1652E" transform="rotate(14 8 8)"/>
    <rect x="-4" y="-6" width="26" height="26" rx="6" fill="#5B6670" transform="rotate(14 8 8)"/>
  </g>

  <!-- Thermomix-style robot on bench -->
  <g transform="translate(660,270)" filter="url(#trSoft)">
    <!-- base -->
    <rect x="-140" y="270" width="280" height="46" rx="16" fill="url(#trBodyGrad)"/>
    <!-- body / jar -->
    <path d="M-118 60 Q-118 -10 0 -10 Q118 -10 118 60 L108 260 Q108 296 0 296 Q-108 296 -118 260 Z" fill="url(#trBodyGrad)"/>
    <!-- handle -->
    <path d="M-118 90 Q-158 90 -158 130 L-158 180 Q-158 220 -118 220" fill="none" stroke="#0A1F17" stroke-width="16" stroke-linecap="round"/>
    <!-- control panel -->
    <rect x="-84" y="30" width="168" height="96" rx="18" fill="#0E2D21"/>
    <rect x="-70" y="44" width="140" height="52" rx="8" fill="url(#trGreenGrad)" opacity=".92"/>
    <circle cx="0" cy="106" r="12" fill="#8FDBB6"/>
    <!-- dial -->
    <circle cx="0" cy="230" r="34" fill="#0E2D21"/>
    <circle cx="0" cy="230" r="34" fill="none" stroke="#8FDBB6" stroke-width="3"/>
    <rect x="-3" y="200" width="6" height="20" rx="3" fill="#8FDBB6"/>
    <!-- steam lines -->
    <g stroke="#8FDBB6" stroke-width="6" stroke-linecap="round" opacity=".65">
      <path d="M-40 -20 q10 -22 0 -40" fill="none"/>
      <path d="M0 -24 q10 -22 0 -42" fill="none"/>
      <path d="M40 -20 q10 -22 0 -40" fill="none"/>
    </g>
  </g>

  <!-- repair badge -->
  <g transform="translate(830,470)">
    <circle cx="0" cy="0" r="54" fill="#C1652E"/>
    <path d="M-16 16 L16 -16 M-6 -22 C4 -32 20 -32 30 -22 C40 -12 40 4 30 14 L20 24 L-4 0 Z M-24 30 L-16 16" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- floor shadow -->
  <ellipse cx="660" cy="590" rx="220" ry="18" fill="#0A1F17" opacity=".08"/>
</svg>
